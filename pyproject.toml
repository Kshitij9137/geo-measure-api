[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.per-file-ignores]
"geospatial/tests/*" = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["geospatial/tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:No directory at:UserWarning",          # WhiteNoise: staticfiles/ not built in tests
    "ignore:.crs. was not provided:UserWarning",   # intentional: tests write a .prj-less shapefile
]

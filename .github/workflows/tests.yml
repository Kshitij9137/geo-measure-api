name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: geomeasure
          POSTGRES_USER: geomeasure
          POSTGRES_PASSWORD: geomeasure
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geomeasure"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://geomeasure:geomeasure@localhost:5432/geomeasure
      DJANGO_SECRET_KEY: ci-only-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest --cov=geospatial --cov-report=term-missing

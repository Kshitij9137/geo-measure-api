services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geomeasure
      POSTGRES_USER: geomeasure
      POSTGRES_PASSWORD: geomeasure
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geomeasure -d geomeasure"]
      interval: 3s
      timeout: 3s
      retries: 15

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://geomeasure:geomeasure@db:5432/geomeasure
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
